# frontend 容器内 nginx：静态托管 + /api 反代 backend（docker-compose 服务名解析）
server {
    listen 80;
    server_name _;

    # Vue SPA 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # history 路由回退（vue-router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 探活精确反代：后端 /health 在根路径，先于 /api/ 匹配（否则透传成 /api/health → 404）
    location = /api/health {
        proxy_pass http://backend:8006/health;
    }

    # API 反代 → backend 容器（8006）
    location /api/ {
        proxy_pass http://backend:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式接口（/api/chat）：关闭缓冲，超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
